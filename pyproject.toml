[build-system]
requires=["setuptools>=75","wheel"]
build-backend="setuptools.build_meta"
[project]
name="codedevx"
version="0.2.0"
requires-python=">=3.11"
dependencies=["openai>=2.0.0","qdrant-client>=1.12.0","SQLAlchemy>=2.0.0","psycopg[binary]>=3.2.0","pydantic>=2.9.0","pydantic-settings>=2.5.0","typer>=0.12.0","httpx>=0.27.0","neo4j>=6.0.0","mcp>=2.0.0,<3"]
[project.optional-dependencies]
dev=["pytest>=8.0.0","ruff>=0.8.0"]
[project.scripts]
codedevx="codedevx.cli:app"
codedevx-mcp="codedevx.mcp.server:main"
[tool.setuptools.packages.find]
where=["src"]
