services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: codedevx
      POSTGRES_PASSWORD: codedevx
      POSTGRES_DB: codedevx
    ports: ["5432:5432"]
    volumes: [codedevx_pg:/var/lib/postgresql/data]
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    ports: ["6333:6333","6334:6334"]
    volumes: [codedevx_qdrant:/qdrant/storage]
  neo4j:
    image: docker.io/library/neo4j:2026.08.2
    environment:
      NEO4J_AUTH: neo4j/codedevx-local
    ports: ["7474:7474","7687:7687"]
    volumes: [codedevx_neo4j:/data]
volumes:
  codedevx_pg:
  codedevx_qdrant:
  codedevx_neo4j:
